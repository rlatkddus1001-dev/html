<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="사이버펑크 네온 아케이드 스타일의 1인용 테트리스 웹 게임">
  <title>NEON TETRIS | 네온 테트리스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Noto+Sans+KR:wght@400;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow-bg"></div>

  <div class="game-wrapper">
    <header class="game-header">
      <h1 class="neon-title" id="main-title">
        <span class="neon-text-cyan">NEON</span>
        <span class="neon-text-pink">TETRIS</span>
      </h1>
      <p class="subtitle">CYBER ARCADE EDITION</p>
    </header>

    <main class="game-layout">
      <!-- Main Game Board Area -->
      <section class="board-section" aria-label="게임 보드 영역">
        <div class="board-frame" id="board-frame">
          <canvas id="board-canvas" width="300" height="600" aria-label="테트리스 게임 보드"></canvas>
          
          <!-- Pause Overlay -->
          <div id="pause-overlay" class="overlay hidden" aria-live="polite">
            <div class="overlay-content">
              <h2 class="neon-sub-cyan">PAUSED</h2>
              <p class="overlay-kr">일시정지</p>
              <button id="btn-overlay-resume" class="neon-btn btn-cyan" type="button">계속하기</button>
            </div>
          </div>

          <!-- Game Over Overlay -->
          <div id="game-over-overlay" class="overlay hidden" aria-live="assertive">
            <div class="overlay-content">
              <h2 class="neon-sub-pink">GAME OVER</h2>
              <p class="overlay-kr">게임 오버</p>
              <div class="final-score-box">
                <span class="final-score-label">최종 점수</span>
                <span id="final-score-val" class="final-score-num">0</span>
              </div>
              <button id="btn-overlay-restart" class="neon-btn btn-pink" type="button">다시 시작</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Side Information and Controls Panel -->
      <aside class="sidebar-section" aria-label="게임 상태 및 조작 패널">
        <!-- Next Piece Preview Card -->
        <div class="panel-card next-card">
          <h2 class="panel-title">NEXT</h2>
          <div class="next-canvas-wrapper">
            <canvas id="next-canvas" width="120" height="120" aria-label="다음 블록 미리보기"></canvas>
          </div>
        </div>

        <!-- HUD Statistics Card -->
        <div class="panel-card hud-card">
          <div class="stat-group">
            <span class="stat-label">SCORE</span>
            <span id="score-display" class="stat-value neon-val-yellow">0</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-row">
            <div class="stat-group half">
              <span class="stat-label">LEVEL</span>
              <span id="level-display" class="stat-value neon-val-cyan">01</span>
            </div>
            <div class="stat-group half">
              <span class="stat-label">LINES</span>
              <span id="lines-display" class="stat-value neon-val-purple">00</span>
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="panel-card buttons-card">
          <button id="btn-pause" class="neon-btn btn-cyan" type="button">일시정지</button>
          <button id="btn-restart" class="neon-btn btn-pink" type="button">다시 시작</button>
        </div>

        <!-- Keyboard Controls Help Guide -->
        <div class="panel-card guide-card">
          <h2 class="panel-title">CONTROLS</h2>
          <ul class="control-list">
            <li>
              <div class="key-group">
                <kbd class="keycap">←</kbd>
                <kbd class="keycap">→</kbd>
              </div>
              <span class="key-desc">좌우 이동</span>
            </li>
            <li>
              <div class="key-group">
                <kbd class="keycap">↓</kbd>
              </div>
              <span class="key-desc">소프트 드롭</span>
            </li>
            <li>
              <div class="key-group">
                <kbd class="keycap">↑</kbd>
              </div>
              <span class="key-desc">시계방향 회전</span>
            </li>
            <li>
              <div class="key-group">
                <kbd class="keycap space">SPACE</kbd>
              </div>
              <span class="key-desc">하드 드롭</span>
            </li>
          </ul>
        </div>
      </aside>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
